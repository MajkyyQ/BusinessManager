{# Rychlý filtr podle stavu s počtem záznamů. Počty berou v úvahu vyhledávání a ostatní filtry. #}{% if chips %}<nav class="bm-chips" aria-label="{{ chips_label|default:'Filtr podle stavu' }}">{% for l,u,n,a,css in chips %}<a class="bm-chip{% if a %} active{% endif %}{% if not n %} empty{% endif %}" href="{{ u }}"{% if a %} aria-current="true"{% endif %}>{% if css %}<span class="bm-dot bg-{{ css }}"></span>{% endif %}{{ l }} <span class="bm-n">{{ n }}</span></a>{% endfor %}</nav>{% endif %}
