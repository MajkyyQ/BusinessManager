<form method="post" class="lk-form" action="{% url 'lookup_new' slug %}">{% csrf_token %}<input type="hidden" name="dep" value="{{ dep }}"><h5 class="mb-1">{{ title }}</h5>
<p class="text-muted small mb-2">Tučně označená pole jsou povinná, ostatní vyplňte, co znáte. Doplnit je lze i později.</p>
{% if form.non_field_errors %}<div class="alert alert-danger py-1">{{ form.non_field_errors }}</div>{% endif %}
<div class="row g-2 mb-2">{% for f in form %}<div class="{% if f.widget_type == 'textarea' %}col-12{% else %}col-md-6{% endif %}">{% include "core/_pole.html" %}</div>{% endfor %}</div>
<div class="text-end"><button type="button" class="btn btn-secondary lk-cancel">Zrušit</button> <button class="btn btn-primary">Vytvořit</button></div></form>
