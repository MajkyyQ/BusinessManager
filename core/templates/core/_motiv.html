<script>/* Tmavý režim: volba se ukládá v prohlížeči ('light', 'dark', nebo nic = podle systému). Skript běží v hlavičce, aby stránka neblikla světlou barvou. */
(function(){var h=document.documentElement,m=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function vol(){try{var v=localStorage.getItem('bm-motiv');return v=='light'||v=='dark'?v:'auto'}catch(e){return 'auto'}}
function apply(){var v=vol();h.setAttribute('data-bs-theme',v=='auto'?(m&&m.matches?'dark':'light'):v);h.setAttribute('data-motiv',v)}
apply();if(m&&m.addEventListener)m.addEventListener('change',apply);
window.bmMotiv={vol:vol,set:function(v){try{if(v=='auto')localStorage.removeItem('bm-motiv');else localStorage.setItem('bm-motiv',v)}catch(e){}apply()}}})();</script>
