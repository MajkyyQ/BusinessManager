{# Přepínač zobrazení tabulka / kanban (inspirace Odoo). Volba se pamatuje pro každý seznam zvlášť. #}{% if pohledy %}<div class="btn-group btn-group-sm bm-views" role="group" aria-label="Zobrazení seznamu">{% for k,l,u,a in pohledy %}<a class="btn btn-outline-secondary{% if a %} active{% endif %}" href="{{ u }}"{% if a %} aria-current="true"{% endif %}>{{ l }}</a>{% endfor %}</div>{% endif %}
