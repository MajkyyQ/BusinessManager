{% extends "core/base.html" %}{% block content %}<div class="d-flex justify-content-between"><h2>Přehled</h2><a class="btn btn-success" hx-boost="false" href="{% url 'plocha_hledat' %}">🖥 Pracovní plocha</a></div>
{% for g,items in groups %}<h5 class="mt-3">{{ g }}</h5><div class="row g-2">
{% for s,n,c in items %}<div class="col-6 col-md-3"><a href="{% url 'list' s %}" class="card text-decoration-none"><div class="card-body py-2">{{ n }} <span class="badge bg-secondary float-end">{{ c }}</span></div></a></div>{% endfor %}</div>{% endfor %}{% endblock %}
