{% if f.widget_type == "checkbox" %}<div class="form-check mt-1">{{ f }} <label class="form-check-label" for="{{ f.id_for_label }}">{{ f.label|capfirst }}</label></div>{% else %}<label class="form-label mb-0 {% if f.field.required %}fw-bold{% endif %}" for="{{ f.id_for_label }}">{{ f.label|capfirst }}</label>{{ f }}{% endif %}{% if f.help_text %}<div class="form-text mt-0">{{ f.help_text }}</div>{% endif %}<div class="text-danger small">{{ f.errors }}</div>
